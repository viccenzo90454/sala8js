<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Cálculos</h1>

    <div>
        <h2>Soma</h2>

        <label for="n1">Primeiro número</label>
        <input type="number" id="n1">

        <label for="n2">Segundo número</label>
        <input type="number" id="n2">

        <button onclick="somar()">Somar</button>

        <p id="resposta"></p>
    </div>

    <div>
        <h2>Subtração</h2>

        <label for="n1">Primeiro número</label>
        <input type="number" id="f1">

        <label for="n2">Segundo número</label>
        <input type="number" id="f2">

        <button onclick="sub()">Subtrair</button>

        <p id="resposta1"></p>
    </div>

    <div>
        <h2>Multiplicação</h2>

        <label for="n1">Primeiro número</label>
        <input type="number" id="g1">

        <label for="n2">Segundo número</label>
        <input type="number" id="g2">

        <button onclick="mult()">Somar</button>

        <p id="resposta2"></p>
    </div>

    <div>
        <h2>Divisão</h2>

        <label for="n1">Primeiro número</label>
        <input type="number" id="d1">

        <label for="n2">Segundo número</label>
        <input type="number" id="d2">

        <button onclick="divsa()">Somar</button>

        <p id="resposta3"></p>
    </div>

    

    


    <script src="java.js"></script>
</body>
</html>
